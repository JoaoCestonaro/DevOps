<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pedido</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            margin: 0;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

        .voltar:hover {
            color: #2980b9;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .titulo-secao {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 8px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #555;
        }

        input[list],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[list]:focus,
        input[type="number"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.25);
        }

        .produto-area {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .btn-adicionar {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background-color: #2ecc71;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-adicionar:hover {
            background-color: #27ae60;
        }

        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 14px 10px;
            text-align: center;
            font-size: 14px;
        }

        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        .imagem-produto {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: #fafafa;
        }

        .sem-imagem {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            border: 1px dashed #bbb;
            border-radius: 8px;
            color: #999;
            font-size: 11px;
        }

        .btn-remove {
            border: none;
            background-color: #e74c3c;
            color: white;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-remove:hover {
            background-color: #c0392b;
        }

        .vazio {
            color: #888;
            padding: 25px;
        }

        .resumo {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 18px;
        }

        .resumo strong {
            color: #2c3e50;
        }

        #totalPedido {
            font-size: 22px;
            font-weight: bold;
            color: #27ae60;
        }

        .btn-salvar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background-color: #3498db;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-salvar:hover {
            background-color: #2980b9;
        }

        @media (max-width: 700px) {

            .container {
                width: 95%;
            }

            .produto-area {
                grid-template-columns: 1fr;
            }

            .btn-adicionar {
                width: 100%;
            }

            th,
            td {
                font-size: 12px;
                padding: 8px 5px;
            }

            .imagem-produto {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cadastro de Pedido</h1>

        <a class="voltar" th:href="@{/home}">
            ← Voltar para a lista de pedidos
        </a>

        <!-- LISTA DE ALUNOS -->
        <datalist id="listaAlunos">

            <option th:each="aluno : ${alunos}"
                    th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
            </option>

        </datalist>

        <!-- LISTA DE PRODUTOS -->
        <datalist id="listaProdutos">

            <option th:each="produto : ${produtos}"
                    th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
                    th:attr="data-preco=${produto.valorProduto},
                             data-id=${produto.idProduto}">
            </option>

        </datalist>


        <!-- IDENTIFICAÇÃO DO ALUNO -->
        <div class="card">

            <div class="titulo-secao">
                I. Identificação do Aluno
            </div>

            <div class="campo">

                <label for="aluno">
                    Aluno
                </label>

                <input list="listaAlunos"
                       id="aluno"
                       name="aluno"
                       type="text"
                       placeholder="Digite o nome ou código do aluno">

            </div>

        </div>


        <!-- ADICIONAR PRODUTO -->
        <div class="card">

            <div class="titulo-secao">
                II. Adicionar produto ao pedido
            </div>

            <div class="produto-area">

                <div class="campo">

                    <label for="produto">
                        Produto
                    </label>

                    <input list="listaProdutos"
                           id="produto"
                           type="text"
                           placeholder="Digite o produto">

                </div>

                <div class="campo">

                    <label for="quantidade">
                        Quantidade
                    </label>

                    <input type="number"
                           id="quantidade"
                           placeholder="0"
                           min="1">

                </div>

                <button type="button"
                        class="btn-adicionar"
                        onclick="adicionarItem()">

                    + Adicionar

                </button>

            </div>

        </div>


        <!-- ITENS DO PEDIDO -->
        <div class="card">

            <div class="titulo-secao">
                III. Produtos do Pedido
            </div>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Imagem</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço Unit.</th>
                            <th>Valor Total</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody id="tabela-itens">

                        <tr id="empty-row">

                            <td colspan="6" class="vazio">
                                Nenhum produto adicionado ao pedido
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- TOTAL -->
            <div class="resumo">

                <strong>
                    Total do Pedido:
                </strong>

                <span>
                    R$
                </span>

                <span id="totalPedido">
                    0,00
                </span>

            </div>


            <!-- SALVAR -->
            <button class="btn-salvar"
                    onclick="salvarPedido()">

                Confirmar e salvar pedido

            </button>

        </div>

    </div>


    <script>

        let itens = [];


        // ==========================================
        // ADICIONAR PRODUTO
        // ==========================================

        function adicionarItem() {

            let produtoInput =
                document.getElementById("produto").value;

            let quantidade =
                document.getElementById("quantidade").value;


            if (!produtoInput || quantidade <= 0) {

                alert(
                    "Preencha corretamente o produto e a quantidade!"
                );

                return;
            }


            let partes =
                produtoInput.split(" - ");


            let produtoId =
                partes[0];

            let produtoNome =
                partes.slice(1).join(" - ");


            // Procurar produto na datalist
            let options =
                document.querySelectorAll(
                    "#listaProdutos option"
                );


            let preco = null;


            options.forEach(opt => {

                if (opt.value === produtoInput) {

                    preco =
                        opt.getAttribute("data-preco");

                }

            });


            if (!preco) {

                alert(
                    "Produto inválido! Selecione um produto da lista."
                );

                return;
            }


            preco =
                parseFloat(preco);


            quantidade =
                parseInt(quantidade);


            let subtotal =
                quantidade * preco;


            // Adiciona o item
            itens.push({

                produto: {
                    idProduto: produtoId
                },

                nomeProduto: produtoNome,

                quantidade: quantidade,

                preco: preco,

                subtotal: subtotal

            });


            // Limpa os campos
            document.getElementById("produto").value = "";

            document.getElementById("quantidade").value = "";


            renderTabela();

        }


        // ==========================================
        // REMOVER ITEM
        // ==========================================

        function removerItem(index) {

            itens.splice(index, 1);

            renderTabela();

        }


        // ==========================================
        // RENDERIZAR TABELA
        // ==========================================

        function renderTabela() {

            let tabela =
                document.getElementById("tabela-itens");


            tabela.innerHTML = "";


            // Nenhum item
            if (itens.length === 0) {

                tabela.innerHTML = `

                    <tr id="empty-row">

                        <td colspan="6" class="vazio">

                            Nenhum produto adicionado ao pedido

                        </td>

                    </tr>

                `;

                document.getElementById(
                    "totalPedido"
                ).innerText = "0,00";

                return;
            }


            let total = 0;


            itens.forEach((item, index) => {

                total += item.subtotal;


                let imagem = `

                    <img
                        class="imagem-produto"
                        src="/produtos/imagem/${item.produto.idProduto}"
                        alt="${item.nomeProduto}"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    >

                    <div
                        class="sem-imagem"
                        style="display:none;">
                        Sem imagem
                    </div>

                `;


                tabela.innerHTML += `

                    <tr>

                        <td>

                            ${imagem}

                        </td>

                        <td>

                            <strong>
                                ${item.nomeProduto}
                            </strong>

                        </td>

                        <td>

                            ${item.quantidade}

                        </td>

                        <td>

                            R$ ${item.preco
                                .toFixed(2)
                                .replace('.', ',')}

                        </td>

                        <td>

                            <strong>
                                R$ ${item.subtotal
                                    .toFixed(2)
                                    .replace('.', ',')}
                            </strong>

                        </td>

                        <td>

                            <button
                                type="button"
                                class="btn-remove"
                                onclick="removerItem(${index})">

                                Remover

                            </button>

                        </td>

                    </tr>

                `;

            });


            document.getElementById(
                "totalPedido"
            ).innerText =
                total
                    .toFixed(2)
                    .replace('.', ',');

        }


        // ==========================================
        // SALVAR PEDIDO
        // ==========================================

        function salvarPedido() {

            let alunoInput =
                document.getElementById("aluno").value;


            if (!alunoInput) {

                alert(
                    "Selecione um aluno antes de salvar!"
                );

                return;
            }


            if (itens.length === 0) {

                alert(
                    "Adicione ao menos um produto ao pedido!"
                );

                return;
            }


            let alunoId =
                alunoInput.split(" - ")[0];


            let pedido = {

                cliente: {
                    idAluno: alunoId
                },

                itens: itens

            };


            fetch("/pedidos", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(pedido)

            })

            .then(res => {

                if (!res.ok) {
                    throw new Error(
                        "Erro HTTP: " + res.status
                    );
                }

                return res.json();

            })

            .then(data => {

                alert(
                    "Pedido salvo com sucesso!"
                );

                location.reload();

            })

            .catch(err => {

                alert(
                    "Erro ao salvar o pedido. Tente novamente."
                );

                console.error(err);

            });

        }

    </script>

</body>

</html>
